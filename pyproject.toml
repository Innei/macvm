[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macvm"
version = "0.1.0"
description = "Headless macOS VM runners for UI verification of Mac apps"
requires-python = ">=3.11"

[project.scripts]
macvm = "macvm.cli:main"

[tool.setuptools]
packages = ["macvm"]
